# Supertrend Flip — adapted from daily_stock_analysis trend-following ideas (MIT).
# Supertrend indicator flips from red (bearish) to green (bullish).
name: supertrend_flip
display_name: Supertrend Flip
description: >-
  Detects a bullish Supertrend flip (bearish to bullish), confirming a
  short-term trend change with ATR-based trailing logic.
category: trend
aliases: [supertrend, atr_trailing]
default_priority: 22
market_regimes: [trending_up]

rules:
  # supertrend(10,3) flipped bullish within last 2 sessions
  - kind: supertrend_flip_up
    period: 10
    multiplier: 3
    within_sessions: 2
    weight: 0.6
  # price above flipped supertrend line
  - kind: price_above_supertrend
    period: 10
    multiplier: 3
    weight: 0.4

scoring:
  base: 58
  flip_bonus: 10
  price_above_bonus: 6

risk:
  stop_loss_pct: 0.03
  target_pct: 0.06
  ideal_buy: near_supertrend
