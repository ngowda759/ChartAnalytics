# Bollinger Squeeze Breakout — adapted from daily_stock_analysis (MIT).
# Narrow Bollinger Band width (squeeze) followed by an expansion breakout.
name: bollinger_squeeze_breakout
display_name: Bollinger Squeeze Breakout
description: >-
  Detects low-vatility squeezes (narrow Bollinger Band width) that break out
  above the upper band on rising volume — a volatility-expansion entry.
category: breakout
aliases: [bb_squeeze, squeeze]
default_priority: 25
market_regimes: [ranging, trending_up]

rules:
  # current bandwidth in the lowest 20% of the last 20 sessions
  - kind: bollinger_squeeze
    period: 20
    width_percentile: 20
    weight: 0.4
  # close above upper band
  - kind: close_above_bollinger_upper
    period: 20
    weight: 0.35
  # volume above 5-day average
  - kind: volume_above_avg
    avg_period: 5
    min_ratio: 1.0
    weight: 0.25

scoring:
  base: 56
  squeeze_bonus: 10
  upper_break_bonus: 8
  volume_confirm_bonus: 6

risk:
  stop_loss_pct: 0.03
  target_pct: 0.07
  ideal_buy: near_upper_band
