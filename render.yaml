services:
  - type: web
    name: chartanalytics-api
    env: python
    region: singapore
    plan: free
    # Match the Python version used by the Dockerfile and CI (3.11). 3.13 can
    # lack wheels for some pinned deps in requirements.lock.txt.
    pythonVersion: "3.11.9"
    buildCommand: cd backend && pip install --no-cache-dir -r requirements.lock.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      # CORS only matters if the browser calls the backend directly. Through the
      # Next.js server-side rewrite proxy (BACKEND_URL on Vercel) the browser
      # never touches the backend, so this is optional. Listed here so direct
      # calls from the Vercel frontend origin are also allowed if needed later.
      - key: CORS_ORIGINS
        value: '["https://chartanalytics.vercel.app","https://chart-analytics-theta.vercel.app","https://tradingassistant.com"]'
      # Allow any Vercel deploy/preview origin (*.vercel.app) so per-commit
      # previews and production both pass CORS preflight without enumerating
      # each preview URL. Safe with allow_credentials (regex, not wildcard "*").
      - key: CORS_ORIGIN_REGEX
        value: 'https://.*\.vercel\.app'
      # Optional integrations — leave unset for read-only NSE / agent-analysis
      # endpoints (they need no external credentials).
      - key: FIRESTORE_PROJECT_ID
        sync: false
      - key: FIRESTORE_EMULATOR_HOST
        sync: false
      - key: REDIS_URL
        sync: false
